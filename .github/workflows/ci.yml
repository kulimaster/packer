name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API – build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: packer
          POSTGRES_PASSWORD: packer
          POSTGRES_DB: packer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packer -d packer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Integrační testy si databázi packer_tests samy vytvoří a zahodí.
      PACKER_TEST_DB: Host=localhost;Port=5432;Database=packer_tests;Username=packer;Password=packer
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Packer.slnx

      - name: Build
        run: dotnet build Packer.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test Packer.slnx --no-build -c Release
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: apps/api/TestResults
          if-no-files-found: ignore

  web:
    name: Web – typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
