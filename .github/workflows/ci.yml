name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API – build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: packer
          POSTGRES_PASSWORD: packer
          POSTGRES_DB: packer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packer -d packer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Integrační testy si databázi packer_tests samy vytvoří a zahodí.
      PACKER_TEST_DB: Host=localhost;Port=5432;Database=packer_tests;Username=packer;Password=packer
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Packer.slnx

      - name: Build
        run: dotnet build Packer.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test Packer.slnx --no-build -c Release
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: apps/api/TestResults
          if-no-files-found: ignore

  web:
    name: Web – typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  # Image se publikují jen z main a jen s tagem commitu (nikdy latest) – viz ADR 0003.
  publish:
    name: Image → GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Registry path
        id: registry
        # GHCR vyžaduje malá písmena, i když má repo v názvu velká.
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Přihlášení do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile.api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.registry.outputs.prefix }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.registry.outputs.prefix }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

